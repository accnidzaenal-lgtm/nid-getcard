<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 558" width="1024" height="558">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="558" fill="url(#bg)"/>

  <!-- Tilted Card Container -->
  <g transform="translate(512, 279) rotate(-14) translate(-512, -279)">
    <!-- Main Card Body -->
    <rect x="332" y="154" width="360" height="250" rx="24" fill="#203a63" filter="url(#shadow)"/>
    
    <!-- Chip Contact on Left -->
    <g transform="translate(370, 254)">
      <rect x="0" y="0" width="38" height="48" rx="8" fill="#ffffff" opacity="0.95"/>
      <line x1="12" y1="0" x2="12" y2="48" stroke="#203a63" stroke-width="2.5"/>
      <line x1="26" y1="0" x2="26" y2="48" stroke="#203a63" stroke-width="2.5"/>
      <line x1="0" y1="16" x2="12" y2="16" stroke="#203a63" stroke-width="2.5"/>
      <line x1="26" y1="16" x2="38" y2="16" stroke="#203a63" stroke-width="2.5"/>
      <line x1="0" y1="32" x2="12" y2="32" stroke="#203a63" stroke-width="2.5"/>
      <line x1="26" y1="32" x2="38" y2="32" stroke="#203a63" stroke-width="2.5"/>
    </g>

    <!-- White Circle Center -->
    <circle cx="530" cy="279" r="82" fill="#ffffff"/>

    <!-- Orange QR Code Graphic -->
    <g transform="translate(482, 231) scale(0.95)">
      <!-- Top-Left Corner Box -->
      <rect x="0" y="0" width="34" height="34" rx="4" fill="#f97316"/>
      <rect x="8" y="8" width="18" height="18" rx="2" fill="#ffffff"/>
      <rect x="13" y="13" width="8" height="8" fill="#f97316"/>

      <!-- Top-Right Corner Box -->
      <rect x="66" y="0" width="34" height="34" rx="4" fill="#f97316"/>
      <rect x="74" y="8" width="18" height="18" rx="2" fill="#ffffff"/>
      <rect x="79" y="13" width="8" height="8" fill="#f97316"/>

      <!-- Bottom-Left Corner Box -->
      <rect x="0" y="66" width="34" height="34" rx="4" fill="#f97316"/>
      <rect x="8" y="74" width="18" height="18" rx="2" fill="#ffffff"/>
      <rect x="13" y="79" width="8" height="8" fill="#f97316"/>

      <!-- QR Pattern Pixels -->
      <rect x="44" y="6" width="12" height="12" rx="2" fill="#f97316"/>
      <rect x="44" y="24" width="12" height="12" rx="2" fill="#f97316"/>
      <rect x="6" y="44" width="12" height="12" rx="2" fill="#f97316"/>
      <rect x="24" y="44" width="12" height="12" rx="2" fill="#f97316"/>
      <rect x="44" y="44" width="14" height="14" rx="2" fill="#ea580c"/>
      <rect x="66" y="44" width="12" height="12" rx="2" fill="#f97316"/>
      <rect x="84" y="44" width="14" height="14" rx="2" fill="#ea580c"/>
      <rect x="44" y="66" width="12" height="12" rx="2" fill="#f97316"/>
      <rect x="44" y="84" width="12" height="12" rx="2" fill="#f97316"/>
      <rect x="66" y="66" width="14" height="14" rx="2" fill="#f97316"/>
      <rect x="84" y="84" width="16" height="16" rx="2" fill="#ea580c"/>
      <rect x="66" y="84" width="10" height="10" rx="2" fill="#f97316"/>
    </g>
  </g>
</svg>